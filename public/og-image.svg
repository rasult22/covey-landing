<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0F"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="900" cy="200" r="250" fill="#6C5CE7" opacity="0.08"/>
  <circle cx="300" cy="450" r="200" fill="#22c55e" opacity="0.05"/>

  <!-- Quadrant Matrix icon -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#22c55e"/>
    <rect x="90" y="0" width="80" height="80" rx="12" fill="#ef4444"/>
    <rect x="0" y="90" width="80" height="80" rx="12" fill="#f59e0b"/>
    <rect x="90" y="90" width="80" height="80" rx="12" fill="#6b7280"/>
  </g>

  <!-- Title -->
  <text x="340" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">
    Principle Planner
  </text>

  <!-- Tagline -->
  <text x="340" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#A0A0B8">
    Plan by Principles, Not Panic
  </text>

  <!-- Separator line -->
  <rect x="340" y="340" width="120" height="3" rx="2" fill="url(#accentGrad)"/>

  <!-- Features -->
  <text x="340" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#6C5CE7">
    Quadrant Matrix  ·  Big Rocks  ·  A-B-C Priorities
  </text>

  <!-- Subtitle -->
  <text x="340" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#707080">
    Built on Stephen Covey's 7 Habits methodology
  </text>

  <!-- App Store badge area -->
  <g transform="translate(340, 475)">
    <rect width="180" height="48" rx="10" fill="white" opacity="0.1"/>
    <text x="90" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" text-anchor="middle">
      Download for iOS
    </text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accentGrad)"/>
</svg>
